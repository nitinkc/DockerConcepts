site_name: Docker & Networking
site_description:
site_author: Nitin Kumar Chaurasia
site_url: https://nitinkc.github.io/DockerConcepts/
repo_url: https://github.com/nitinkc/DockerConcepts
repo_name: nitinkc/DockerConcepts
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/compass-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - mermaid2:
      version: 10.9.3
      arguments:
        theme: neutral
  - mkdocs_quiz:
      enabled_by_default: false
      auto_number: true
      show_correct: true
      auto_submit: false
      disable_after_submit: true
      shuffle_answers: false
      show_progress: true
      confetti: false
      embed_source: false
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - "1. Fundamentals & Architecture":
      - 01-fundamentals-architecture.md
      - "Lab: container-internals": labs/container-internals.md
  - "2. Dockerfile & Images":
      - 02-dockerfile-images.md
      - "Lab: simple-docker-file": labs/simple-docker-file.md
      - "Lab: cmd-vs-entrypoint": labs/cmd-vs-entrypoint.md
      - "Lab: simple-node-backend": labs/simple-node-backend.md
      - "Lab: args-vs-env": labs/args-vs-env.md
      - "Lab: multi-stage-build": labs/multi-stage-build.md
  - "3. Storage & Persistence":
      - 03-storage-persistence.md
      - "Lab: volumes-persistence": labs/volumes-persistence.md
  - "4. Networking":
      - 04-networking.md
      - "Lab: bridge-dns-lab": labs/bridge-dns-lab.md
  - "5. Docker Compose":
      - 05-docker-compose.md
      - "Lab: frontend-compose": labs/frontend-compose.md
      - "Lab: compose-db": labs/compose-db.md
      - "Lab: springboot-redis": labs/springboot-redis.md
      - "Lab: springboot-redis (visits)": labs/springboot-redis-visits.md
  - "6. Command Lifecycle": 06-command-lifecycle.md
